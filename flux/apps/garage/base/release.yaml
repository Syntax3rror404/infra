---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: garage
  namespace: garage
spec:
  interval: ${helm_source_interval}
  url: https://git.deuxfleurs.fr/Deuxfleurs/garage
  ref:
    # semver uses tag
    # Capped below v2.4.0: that build panics in rustls ("could not automatically
    # determine the process-level CryptoProvider") as soon as kubernetes-discovery
    # opens a TLS client, so all 3 replicas crashloop. Fixed upstream by PR #1527
    # (merged 2026-09-07): raise to <v3.0.0 once v2.4.1 is tagged. Same root cause
    # hit consul-discovery, see issue #1526.
    semver: ">=v2.1.0 <v2.4.0"
  ignore: |
    # exclude all
    /*
    # include charts directory
    !/script/helm/garage
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage
  namespace: garage
spec:
  interval: ${helm_release_interval}
  maxHistory: 3
  chart:
    spec:
      chart: script/helm/garage
      sourceRef:
        kind: GitRepository
        name: garage
        namespace: garage
