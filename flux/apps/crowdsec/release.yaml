---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: crowdsec
  namespace: crowdsec
spec:
  interval: ${helm_source_interval}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    semver: ">=0.24.0 <1.0.0"
  url: oci://ghcr.io/crowdsecurity/helm-charts/crowdsec
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: crowdsec
spec:
  interval: ${helm_release_interval}
  maxHistory: 3
  # Helm's default wait is 5m, which this release no longer fits into. The
  # agent DaemonSet rolls sequentially across 3 nodes and each pod now spends
  # up to ~25s in the download-ai-user-agents retry loop before falling back,
  # so a full rollout takes ~6m (measured: pods came up 16:03:02, 16:05:13,
  # 16:07:05). Helm then reports "timeout waiting for DaemonSet ... InProgress"
  # and marks the release failed even though the rollout completes fine
  # moments later — which in turn blocks subsequent reconciles.
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: crowdsec
    namespace: crowdsec
  values:
    # Talos uses containerd (default is docker)
    container_runtime: containerd

    config:
      scenarios:
        custom-http-ai-user-agent.yaml: |
          name: custom/http-ai-user-agent
          description: Detect usage of AI User Agent
          type: trigger
          # len(#) > 4 excludes overly generic single-word list entries (e.g. "Code")
          # that would false-positive on unrelated user agents via the "contains" match.
          # auth.${external_domain} (Keycloak) is excluded: it's auth infrastructure,
          # not crawlable content, so blocking AI-labeled UAs there has no anti-scraping
          # value but risks locking out legitimate OIDC clients (e.g. kubectl).
          #
          # facebookexternalhit is excluded by name. The list carries it because Meta
          # reuses that crawler for AI training data, but it is also the OpenGraph
          # link-preview fetcher, and Apple's Messages app appends it verbatim to an
          # ordinary Safari UA whenever a user shares a link:
          #   Mozilla/5.0 (Macintosh; Intel Mac OS X 10_11_1) AppleWebKit/601.2.4
          #   (KHTML, like Gecko) Version/9.0.1 Safari/601.2.4
          #   facebookexternalhit/1.1 Facebot Twitterbot/1.0
          # Observed twice, last on 2026-08-20, from the operator's own home IP
          # against vodafone.${external_domain}. Since this scenario is
          # `type: trigger`, a single shared link banned the whole household NAT
          # address for every service on the gateway. Blocking it bought nothing --
          # none of these hosts serve scrapeable content -- so the exclusion is a
          # pure win. FacebookBot, a separate list entry and Meta's actual training
          # crawler, stays blocked.
          #
          # Evaluated before the any(File(...)) loop so these requests short-circuit
          # instead of being compared against all 164 list entries.
          filter: evt.Meta.log_type in ["http_access-log", "http_error-log"] and evt.Meta.target_fqdn != "auth.${external_domain}" and not (Upper(evt.Meta.http_user_agent) contains "FACEBOOKEXTERNALHIT") and any(File("ai_user_agents.txt"), {len(#) > 4 and Upper(evt.Meta.http_user_agent) contains Upper(#)})
          data:
            - source_url: https://raw.githubusercontent.com/ai-robots-txt/ai.robots.txt/refs/heads/main/haproxy-block-ai-bots.txt
              dest_file: ai_user_agents.txt
              type: string
          labels:
            confidence: 2
            spoofable: 1
            type: scan
            classification:
              - attack.T1595
            behavior: http:scan
            label: AI User Agent
            service: http
            remediation: true
      # Custom parser whitelist: exempt SUCCESSFUL kube-apiserver traffic from the
      # generic behavioral scan scenarios (http-probing, http-crawl-non_statics, …).
      # The k8s.${external_domain} HTTPRoute is hard-gated by a mandatory Keycloak
      # JWT SecurityPolicy (see resources/gateway-kubernetes-api.yaml) + apiserver
      # RBAC — unauthenticated traffic never reaches the backend — so CrowdSec's
      # HTTP scan detection there is redundant, while a burst of legitimate
      # authenticated kubectl/Lens/k9s/flux requests can trip http-crawl-non_statics
      # and self-ban the admin's dynamic IP.
      # Only 1xx/2xx/3xx (authenticated, successful) is whitelisted, so an
      # unauthenticated attacker hammering the endpoint (401 bursts) can STILL be
      # detected. The community IP blocklist stays active regardless (IP decisions
      # are independent of this parse-time whitelist).
      parsers:
        s02-enrich:
          custom-kube-apiserver-whitelist.yaml: |
            name: custom/kube-apiserver-whitelist
            description: "Whitelist authenticated kube-apiserver traffic (JWT-gated route)"
            filter: "evt.Meta.service == 'http' && evt.Meta.log_type in ['http_access-log', 'http_error-log'] && evt.Meta.target_fqdn == 'k8s.${external_domain}'"
            whitelist:
              reason: "kube-apiserver protected by mandatory Keycloak JWT + RBAC; anything but 401 is authenticated traffic, exempt it from behavioral scan scenarios"
              expression:
                # Not '^[123]': Lens lists job history and requests pods the GC
                # already removed -- 11x 404 in one second tripped http-probing
                # and banned the admin's own IP (2026-09-01). Envoy answers a
                # missing/invalid JWT with 401 and never reaches the apiserver,
                # so any other status means the token was valid. A 401 burst
                # stays detectable.
                - evt.Meta.http_status != '401'
          # Two distinct false positives on nextcloud.${external_domain}, both
          # observed self-banning the owner's own Nextcloud desktop client:
          #
          # 1) ext_authz feedback loop. Once ANY ip is banned, the Envoy bouncer
          #    answers every further request with its own 403 block page. Those
          #    403s are logged by Envoy and re-parsed here, and http-probing
          #    counts 403 just like 404 — so a retrying client renews its own ban
          #    indefinitely (observed: 11 events in a single second, all 403 on
          #    ordinary paths like /status.php). The block itself is unaffected;
          #    this only stops a decision from amplifying itself. Envoy marks
          #    these unambiguously as response_code_details=ext_authz_denied /
          #    response_flags=UAEX, which the envoy-logs parser does not map into
          #    evt.Meta, hence the evt.Line.Raw match.
          #
          # 2) WebDAV chunked upload. crowdsecurity/nextcloud-whitelist already
          #    exempts DAV 404s but only for PROPFIND/GET/DELETE — the upload
          #    verbs are missing, so a failing chunked upload (MKCOL 201 followed
          #    by PUT 404) trips http-probing. These verbs require an
          #    authenticated session; an unauthenticated prober gets 401, not
          #    404, and is therefore still detected.
          #
          # Verified with `cscli explain` against real log lines: the 403 and the
          # DAV PUT 404 are whitelisted, while a GET 404 on /wp-login.php still
          # triggers http-probing, http-wordpress-scan and admin-interface-probing.
          custom-nextcloud-dav-whitelist.yaml: |
            name: custom/nextcloud-dav-whitelist
            description: "Stop CrowdSec's own 403 block page and failed WebDAV uploads from self-banning legitimate Nextcloud clients"
            filter: "evt.Meta.service == 'http' && evt.Meta.log_type in ['http_access-log', 'http_error-log'] && evt.Meta.target_fqdn == 'nextcloud.${external_domain}'"
            whitelist:
              reason: "ext_authz block-page 403s must not feed back into scan scenarios; authenticated WebDAV upload 404s are not probing"
              expression:
                - evt.Meta.http_status == '403' && evt.Line.Raw contains 'ext_authz_denied'
                - evt.Meta.http_status == '404' && evt.Meta.http_verb in ['PUT', 'MKCOL', 'MOVE'] && evt.Meta.http_path matches '^/remote.php/(web)?dav/'
          # Coraza (the WASM WAF on the Keycloak route, see
          # clusters/tokamak/resources/coraza-waf.yaml) blocks by emitting an
          # Envoy local reply. That 403 is written to the access log this agent
          # parses, so repeated WAF blocks would feed crowdsecurity/http-probing
          # and escalate to an IP ban across EVERY service — Nextcloud, kubectl,
          # everything. For a real attacker that is desirable; for a WAF false
          # positive it is the same self-lockout that already happened twice.
          #
          # Measured signature of a Coraza block (Coraza calls SendHttpResponse
          # without a details string, so unlike the CrowdSec bouncer it leaves
          # no marker of its own):
          #   "response_code":403  "response_code_details":""  "upstream_host":null
          # A 403 that genuinely came from Keycloak carries
          # "response_code_details":"via_upstream" and a real upstream_host, so
          # it is NOT whitelisted here and still counts toward scan detection.
          #
          # Note what this trades away: WAF blocks no longer escalate an
          # attacker to an IP ban. In practice that costs little — the scanners
          # observed so far were all caught independently by
          # crowdsecurity/http-backdoors-attempts. Revisit once the WAF runs in
          # enforcement mode with a tuned, quiet rule set.
          custom-coraza-block-whitelist.yaml: |
            name: custom/coraza-block-whitelist
            description: "Keep Coraza's own WAF blocks from escalating into cluster-wide IP bans"
            filter: "evt.Meta.service == 'http' && evt.Meta.log_type in ['http_access-log', 'http_error-log'] && evt.Meta.target_fqdn == 'auth.${external_domain}'"
            whitelist:
              reason: "WAF-generated local replies must not feed behavioural scan scenarios"
              expression:
                - evt.Meta.http_status == '403' && evt.Line.Raw contains '"response_code_details":""' && evt.Line.Raw contains '"upstream_host":null'
      # Mirrors current `cscli console status` (manual/custom/tainted/context
      # were already enabled imperatively) + turns on console_management so
      # decisions assigned to this instance via the console get pulled too.
      console.yaml: |
        share_manual_decisions: true
        share_custom: true
        share_tainted: true
        share_context: true
        console_management: true
      # Overrides the chart image's baked-in default profiles.yaml, so the two
      # stock catch-all profiles are reproduced below our custom one.
      profiles.yaml: |
        name: ai_user_agent_short_ban
        # Fallback safety net, not the primary fix (see the auth.${external_domain}
        # exclusion on the scenario itself). Confidence is low (spoofable UA header,
        # single trigger event), so if this ever misfires on another host it should
        # self-heal in minutes instead of requiring a manual `cscli decisions delete`.
        filters:
          - Alert.GetScenario() == "custom/http-ai-user-agent"
        decisions:
          - type: ban
            duration: 5m
        on_success: break
        ---
        name: default_ip_remediation
        filters:
          - Alert.Remediation == true && Alert.GetScope() == "Ip"
        decisions:
          - type: ban
            duration: 4h
        on_success: break
        ---
        name: default_range_remediation
        filters:
          - Alert.Remediation == true && Alert.GetScope() == "Range"
        decisions:
          - type: ban
            duration: 4h
        on_success: break

    # ---------------------------------------------------------------
    # Local API: stores decisions, serves them to the Envoy bouncer.
    # ---------------------------------------------------------------
    lapi:
      # Housekeeping before LAPI starts. Two registries grow without bound:
      #
      #   bouncers  — every source IP authenticating with the pre-registered
      #               envoybouncer key gets its own entry (`Auto Created: true`).
      #               Each bouncer pod restart adds one. Measured: 21 entries,
      #               20 dead, oldest seven weeks old.
      #   machines  — every agent pod registers under its pod name, and the
      #               DaemonSet rolls on every config change. Measured: 57
      #               entries for 3 running agents.
      #
      # Neither is a security issue — the bouncer entries are per-instance
      # records of one shared key, and stale machines cannot connect. But both
      # lists become useless, and they are exactly what one reads when debugging
      # "is the bouncer pulling decisions?" or "is that agent still parsing?".
      #
      # Runs as an init container because cscli operates directly on the SQLite
      # file: before LAPI starts there is guaranteed to be no competing writer.
      #
      # `--duration 24h` spares anything seen within the last 24 hours: the
      # active bouncer polls every 10s and running agents stay connected, so
      # only genuinely dead records are removed. Agents re-register on their own
      # (auto_registration is enabled) should one ever be pruned while offline.
      # `|| true` so a failure while tidying up can never keep LAPI from
      # starting.
      extraInitContainers:
        - name: prune-stale-bouncers
          # Keep in sync with the chart's LAPI image (currently v1.7.8).
          image: docker.io/crowdsecurity/crowdsec:v1.7.8
          command: ["sh", "-ec"]
          args:
            - |
              if [ ! -f /etc/crowdsec/config.yaml ]; then
                echo "no persisted config.yaml yet (first start) - nothing to prune"
                exit 0
              fi
              cscli bouncers prune --duration 24h --force || true
              cscli machines prune --duration 24h --force || true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            # subPath is mandatory and matches the main container. Without it the
            # mount lands on the PVC root while the real database sits in
            # <pvc-root>/crowdsec/crowdsec.db — cscli then silently creates an
            # empty database at the root, reports "No bouncers to prune." and
            # exits 0. A wrong-target failure that looks like success.
            - name: crowdsec-db
              mountPath: /var/lib/crowdsec/data
              subPath: crowdsec
            # Mount the config PVC at /etc/crowdsec here, NOT at
            # /etc/crowdsec_data as the main container does. config.yaml refers
            # to /etc/crowdsec/{local_api,online_api}_credentials.yaml and
            # profiles.yaml by absolute path; in an init container /etc/crowdsec
            # is otherwise the image default without those files and cscli aborts
            # with
            #   "loading online client credentials: open
            #    /etc/crowdsec//online_api_credentials.yaml: no such file"
            # Mounted here every path resolves on its own and cscli needs no -c.
            # Verified: the PVC holds config.yaml, both credentials files,
            # profiles.yaml, console.yaml as well as hub and collections.
            - name: crowdsec-config
              mountPath: /etc/crowdsec
      env:
        # Pull the community blocklist (known-bad IPs) — free, no console needed.
        - name: DISABLE_ONLINE_API
          value: "false"
        # Register the Envoy bouncer on startup with a predefined key.
        - name: BOUNCER_KEY_envoybouncer
          valueFrom:
            secretKeyRef:
              name: crowdsec-bouncer
              key: api-key
        # Enroll this Security Engine into the CrowdSec Console dashboard.
        - name: ENROLL_KEY
          valueFrom:
            secretKeyRef:
              name: crowdsec-bouncer
              key: enroll-key
        - name: ENROLL_INSTANCE_NAME
          value: "${cluster_name}"
        - name: ENROLL_TAGS
          value: "k8s ${cluster_name} envoy"
      persistentVolume:
        config:
          enabled: true
          storageClassName: ${default_storage_class}
          size: 500Mi
        data:
          enabled: true
          storageClassName: ${default_storage_class}
          size: 1Gi
      resources:
        requests:
          cpu: 50m
          memory: 100Mi
        limits:
          memory: 200Mi
      nodeSelector:
        kubernetes.io/os: linux

    # ---------------------------------------------------------------
    # Agent: DaemonSet, parses Envoy access logs -> alerts -> decisions.
    # ---------------------------------------------------------------
    agent:
      acquisition:
        - namespace: envoy-gateway-system
          podName: envoy-*
          program: envoy
          poll_without_inotify: true
      env:
        - name: COLLECTIONS
          value: >-
            yanis-kouidri/envoy
            crowdsecurity/http-cve
            crowdsecurity/http-dos
        # Official maintained whitelist for legitimate Nextcloud client traffic.
        # Nextcloud apps (iOS/Android/desktop) generate bursts of 404s on
        # preview/thumbnail endpoints (/index.php/core/preview?fileId=…&x=…&y=…)
        # and many distinct URIs via WebDAV sync — patterns that otherwise trip
        # the generic crowdsecurity/http-probing and http-crawl-non_statics
        # scenarios and ban the user's own dynamic IP. This parser exempts only
        # those specific benign patterns (scoped by status+verb+path+args), so
        # real probing/CVE scanning of the Nextcloud host is still detected.
        - name: PARSERS
          value: crowdsecurity/nextcloud-whitelist
      resources:
        requests:
          cpu: 50m
          memory: 100Mi
        limits:
          memory: 200Mi
      extraVolumes:
        - name: varlibcrowdsecdata
          emptyDir: {}
      extraVolumeMounts:
        - name: varlibcrowdsecdata
          mountPath: /var/lib/crowdsec/data
      # Download lists
      extraInitContainers:
        - name: download-ai-user-agents
          image: docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
          command: ["sh", "-c"]
          args:
            # This list is re-fetched on every pod start (the target is an
            # emptyDir), so a DaemonSet rollout means three requests to
            # raw.githubusercontent.com in quick succession. GitHub answers 429
            # under rate limiting, plain `curl -fsSL` exits 22, and the init
            # container fails — which with maxUnavailable=1 wedges the whole
            # rollout: the updated node never becomes ready, so the remaining
            # agents are never updated either. Observed exactly that.
            #
            # Retry transient failures, and if the download still fails, start
            # with an empty list rather than blocking the agent from running.
            # The scenario evaluates `any(File("ai_user_agents.txt"), …)`, which
            # is simply false for an empty file — AI-UA detection is then
            # inactive until a later restart succeeds, but log parsing, the
            # whitelists and every other scenario keep working. A degraded
            # agent beats an agent that will not start.
            - |
              set -u
              DEST=/var/lib/crowdsec/data/ai_user_agents.txt
              if curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 60 \
                   https://raw.githubusercontent.com/ai-robots-txt/ai.robots.txt/refs/heads/main/haproxy-block-ai-bots.txt \
                   -o "$DEST"; then
                echo "ai_user_agents.txt: $(wc -l < "$DEST") entries"
              else
                # NOT an empty file: CrowdSec does not register a zero-entry
                # data file in its expr library, so File("ai_user_agents.txt")
                # then fails with "not found in expr library" on every single
                # evaluation of the scenario (observed 44 errors in ~2 minutes).
                # One short placeholder line keeps the key registered, and the
                # scenario's own `len(#) > 4` guard makes it unmatchable — so
                # the scenario is inert rather than erroring.
                echo "WARNING: download failed (rate limited?), using inert placeholder list"
                echo "-" > "$DEST"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: varlibcrowdsecdata
              mountPath: /var/lib/crowdsec/data
