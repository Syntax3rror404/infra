---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: keycloak
spec:
  values:
    podSecurityContext: 
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    keycloak:
      cache:
        type: local

    extraEnv:
      - name: MALLOC_ARENA_MAX
        value: "2"

    httpRoute:
      enabled: true
      hostnames:
        - auth.${external_domain}
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: envoy-gateway-external
          namespace: envoy-gateway-system
      # Pin the realm. The chart default is a bare `/realms`, which also
      # publishes /realms/master — the admin realm's OIDC endpoints were
      # answering from the internet (openid-configuration 200, auth 302) even
      # though the admin console itself is internal-only on adminHttpRoute.
      # Gateway API PathPrefix matches whole path elements, so /realms/mog
      # cannot be widened by a crafted realm name (/realms/mogX does not match).
      # This is the cheap control: /realms/master stops being routable at all,
      # rather than being flagged one layer later by the WAF.
      #
      # /.well-known stays. Besides the realm-scoped OIDC discovery document,
      # Keycloak also answers the RFC 8414 form, which inserts the well-known
      # segment instead of appending it:
      # /.well-known/oauth-authorization-server/realms/mog returns the same
      # metadata (verified: HTTP 200, byte-identical). Removing the prefix would
      # break clients that resolve metadata that way.
      matches:
        - path:
            type: PathPrefix
            value: /realms/mog
        - path:
            type: PathPrefix
            value: /resources
        - path:
            type: PathPrefix
            value: /.well-known

    adminHttpRoute:
      enabled: true
      hostnames:
        - auth-admin.${internal_domain}
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: envoy-gateway-internal
          namespace: envoy-gateway-system

    mariadbOperator:
      enabled: true
      database: keycloak
      username: keycloak
      password: "${keycloak_mariadb_password}"
      useExisting:
        enabled: true
        namespace: mariadb-prod
        mariaDbRef: mariadb-prod

    admin:
      username: admin
      password: "${keycloak_admin_password}"

    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists

    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"