---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  values:
    nextcloud:
      host: nextcloud.${external_domain}
      username: admin
      password: ${nextcloud_admin_password}

      securityContext:
        runAsUser: 33
        runAsGroup: 101
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      # image-native: sets upload_max_filesize + post_max_size (nextcloud.ini); matches nginx client_max_body_size
      extraEnv:
        - name: PHP_UPLOAD_LIMIT
          value: 16G

      # chart only pre-creates redis-session.ini for redis.enabled, not externalRedis
      extraInitContainers:
        - name: init-redis-session-ini
          image: docker.io/library/alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          command: ["touch", "/php-confd/redis-session.ini"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            runAsUser: 33
            runAsGroup: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: php-confd
              mountPath: /php-confd
      extraVolumes:
        - name: php-confd
          emptyDir:
            sizeLimit: 1Mi
      extraVolumeMounts:
        - name: php-confd
          mountPath: /usr/local/etc/php/conf.d/redis-session.ini
          subPath: redis-session.ini

      phpConfigs:
        zz-pm.conf: |
          [www]
          pm = dynamic
          pm.max_children = 128
          pm.start_servers = 32
          pm.min_spare_servers = 32
          pm.max_spare_servers = 96

      configs:
        custom-overwrite.config.php: |-
          <?php
          $CONFIG = array (
            'overwrite.cli.url' => 'https://nextcloud.nextcloud.svc.cluster.local',
            'overwriteprotocol' => 'https',
          );

        custom.config.php: |
          <?php
            $CONFIG = array(
              'check_data_directory_permissions' => false, # https://docs.nextcloud.com/server/latest/admin_manual/configuration_server/
              'allow_local_remote_servers' => true,
            );

        proxy.config.php: |-
          <?php
          $CONFIG = array (
            'trusted_proxies' => array(
              0 => '127.0.0.1',
              1 => '10.0.0.0/8',
            ),
            'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
          );

        domains.config.php: |-
          <?php
          $CONFIG = array (
            'trusted_domains' =>
              array (
              0 => '192.168.35.*',
              1 => 'nextcloud.tokamak.labza',
              2 => 'nextcloud.menofgaming.de',
              3 => 'rancher.tokamak.labza',
              4 => 'nextcloud.tokamak.labza',
              )
          );

        logging.config.php: |-
          <?php
          $CONFIG = array (
            'log_type' => 'file',
            'logfile' => '/var/www/html/data/nextcloud.log',
            'loglevel' => 2,
            'logdateformat' => 'F d, Y H:i:s'
            );

        db.config.php: |-
          <?php
          $CONFIG['dbhost'] = '${mariadb_prod}';

    persistence:
      enabled: true
      size: 500Gi
      storageClass: "longhorn-prod"
      accessMode: ReadWriteOnce

    image:
      flavor: fpm

    cronjob:
      enabled: true
      type: cronjob
      cronjob:
        successfulJobsHistoryLimit: 1
        failedJobsHistoryLimit: 1
        securityContext:
          runAsUser: 33
          runAsGroup: 101
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault

        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - nextcloud
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - app
                topologyKey: kubernetes.io/hostname

    nginx:
      enabled: true
      image:
        repository: nginxinc/nginx-unprivileged
        tag: alpine
        pullPolicy: IfNotPresent
      config:
        default: true
        serverBlockCustom: |
          # set max upload size - match php upload_max_filesize/post_max_size (zz-php.ini)
          # explicit override: chart default (512M) is well below what video files need
          client_max_body_size 16G;
          client_body_timeout 300s;
          # bigger fastcgi buffers reduce disk spillover for the byte-range
          # reads video seeking generates (default chart value is 64x4k = 256K)
          fastcgi_buffers 256 16k;
          fastcgi_buffer_size 32k;
          fastcgi_read_timeout 3600s;
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
      securityContext:
        runAsUser: 33
        runAsGroup: 101
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

    externalRedis:
      enabled: true
      host: valkey.nextcloud.svc.cluster.local
      port: "6379"
      existingSecret:
        enabled: true
        secretName: nextcloud-valkey
        passwordKey: password

    externalDatabase:
      enabled: true
      type: mysql
      host: ${mariadb_prod}
      user: nextcloud
      password: "${nextcloud_mariadb_password}"
      database: nextcloud

    #externalDatabase:
    #  enabled: true
    #  type: mysql
    #  host: nextcloud-mariadb.svc
    #  user: nextcloud
    #  password: "${nextcloud_mariadb_password}"
    #  database: nextcloud
    #
    mariadb:
      enabled: false
      primary:
        livenessProbe:
          enabled: false
        readinessProbe:
          enabled: false
        persistence:
          enabled: true
          storageClass: "longhorn-prod"
      auth:
        database: nextcloud
        username: nextcloud
        password: "${nextcloud_mariadb_password}"
        rootPassword: "${nextcloud_mariadb_root_password}"
        existingSecret: ""
