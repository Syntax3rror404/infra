---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: vodafone-router
  namespace: envoy-gateway-system
spec:
  endpoints:
    - ip:
        address: "192.168.100.1"
        port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vodafone
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: envoy-gateway-external
      namespace: envoy-gateway-system
  hostnames:
    - vodafone.${external_domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: vodafone-router
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: vodafone
  namespace: envoy-gateway-system
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vodafone
  oidc:
    provider:
      issuer: "https://auth.${external_domain}/realms/mog"
      authorizationEndpoint: "https://auth.${external_domain}/realms/mog/protocol/openid-connect/auth"
      tokenEndpoint: "https://auth.${external_domain}/realms/mog/protocol/openid-connect/token"
    clientID: "${oauth2_proxy_clientID}"
    clientSecret:
      name: sso-oidc-secret
    redirectURL: "https://vodafone.${external_domain}/oauth2/callback"
    refreshToken: true
    # Puts the access token into Authorization: Bearer for the jwt filter below,
    # which runs after oauth2 in the chain. Reading it from the cookie instead
    # would need disableTokenEncryption (tokens are encrypted since EG v1.6).
    forwardAccessToken: true
  jwt:
    # A missing token must not 401 here -- that would break the OIDC callback.
    # Enforcement stays with authorization below: no token, no rule match, Deny.
    optional: true
    providers:
      - name: keycloak
        issuer: "https://auth.${external_domain}/realms/mog"
        # No audiences: Keycloak access tokens carry aud=account, not the client id.
        remoteJWKS:
          uri: "https://auth.${external_domain}/realms/mog/protocol/openid-connect/certs"
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-vodafone-group
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims:
              # Requires a Group Membership mapper (claim "groups") on the client.
              # Leading slash = Keycloak's "Full group path" is on.
              - name: groups
                valueType: StringArray
                values: ["/vodafone"]
