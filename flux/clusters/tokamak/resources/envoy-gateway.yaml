---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy
    namespace: envoy-gateway-system
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy
  namespace: envoy-gateway-system
spec:
  # Unset, Envoy starts one worker thread per cpuset thread — 16 on these
  # nodes. That was already pure overhead (the external proxy idles at ~8m CPU
  # / 34Mi), but it becomes a real hazard with the Coraza WASM filter in
  # resources/coraza-waf.yaml: proxy-wasm instantiates one VM per worker
  # thread, so the compiled OWASP CRS ruleset would be held 16 times over and
  # could push the proxy past its 512Mi limit. An OOMKill there takes down the
  # whole external gateway, not just the route the WAF is attached to.
  concurrency: 4
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        externalTrafficPolicy: Cluster
      envoyDeployment:
        container:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # Headroom for 4 WASM VMs each holding the CRS ruleset.
              memory: 1Gi
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-gateway-internal
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    labels:
      lb.cilium.io/pool: envoy-gateway-internal
  listeners:
    - name: http
      protocol: HTTP
      #hostname: "*.tokamak.labza"
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      #hostname: "*.tokamak.labza"
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            namespace: envoy-gateway-system
            name: envoy-gateway-internal-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: envoy-gateway-internal-cert
  namespace: envoy-gateway-system
spec:
  dnsNames:
    - "*.tokamak.labza"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: labza-ca
  privateKey:
    algorithm: ECDSA
    encoding: PKCS8
    size: 256
  secretName: envoy-gateway-internal-cert
  usages:
    - digital signature
    - key encipherment
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-gateway-external
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    labels:
      lb.cilium.io/pool: envoy-gateway-external
  listeners:
    - name: http
      protocol: HTTP
      #hostname: "*.tokamak.labza"
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      #hostname: "*.tokamak.labza"
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            namespace: envoy-gateway-system
            name: envoy-gateway-external-cert
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: zapf.marcel@outlook.com
    privateKeySecretRef:
      name: letsencrypt-prod-private-key
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: envoy-gateway-external
                namespace: envoy-gateway-system
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: envoy-gateway-external-cert
  namespace: envoy-gateway-system
spec:
  secretName: envoy-gateway-external-cert
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  isCA: false
  privateKey:
    algorithm: ECDSA
    encoding: PKCS8
    size: 256
  commonName: "*.menofgaming.de"
  dnsNames:
    - "*.menofgaming.de"
