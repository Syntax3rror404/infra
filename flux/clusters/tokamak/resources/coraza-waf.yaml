---
# Coraza (ModSecurity-compatible) WAF as an Envoy WASM filter.
#
# WHY HERE AND NOT IN CROWDSEC: CrowdSec's ext_authz bouncer already inspects
# every request for IP-based decisions, but its AppSec/WAF mode is all-or-
# nothing — the bouncer has no host/path/route scoping, so enabling it would
# put full inline inspection in front of *every* service behind the external
# gateway, including Nextcloud's WebDAV traffic. Coraza runs inside the Envoy
# process instead (no extra network hop, no extra pod) and attaches to a single
# HTTPRoute, so the WAF can be introduced one application at a time.
#
# SCOPE: auth.${external_domain} (Keycloak) only. It is the highest-value
# target on the gateway — login endpoint, credential stuffing, injection — and
# generates far less rule noise than a file-sync backend.
#
# failOpen: true is NOT optional here. Keycloak is the OIDC issuer for the
# kubectl context; if this filter ever fails to initialise and we failed
# closed, we would lose both web logins AND cluster access at once.
#
# ENFORCING. SecRuleEngine is On: CRS drops a request once its inbound anomaly
# score reaches the threshold (5). Upstream warns that "a WAF is not a
# plug-and-play security solution — it requires configuration and tuning
# tailored to the environment", so this was not switched on blind. Tuning that
# preceded it:
#   * ~1 day in DetectionOnly. 93 detections, all of them one false positive
#     (932160 on a legacy $Path cookie name) — excluded below.
#   * ARGS:password removed from CRS targets, because the login body is
#     inspected and passwords legitimately look like injection payloads.
#   * The path allowlist below stays on `pass,log`. It does NOT block: the
#     account console and the SAML endpoint are served but outside its pattern,
#     so arming it would break legitimate Keycloak features. Narrowing the
#     HTTPRoute to /realms/mog is the better control and is done there.
#
# Rollback is one word: SecRuleEngine On -> DetectionOnly.
#
# CRS is embedded in the extension image, so no ruleset needs to be shipped or
# mounted separately.
#
# BEFORE ATTACHING THIS TO ANY OTHER ROUTE, note what @recommended-conf turns on:
#   SecRequestBodyAccess On
#   SecRequestBodyLimit 131072          (128 KB)
#   SecRequestBodyLimitAction Reject    <-- larger bodies are REJECTED
#   SecResponseBodyAccess On
# Harmless for Keycloak (login forms are a few KB). Fatal for Nextcloud, whose
# uploads are configured up to 16G — that route needs ProcessPartial and a
# WebDAV exclusion, or no WAF at all.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: coraza-waf
  namespace: keycloak
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: keycloak
  wasm:
    - name: coraza
      rootID: waf
      failOpen: true
      code:
        type: Image
        image:
          url: ghcr.io/corazawaf/coraza-proxy-wasm:0.6.0
          # NOT the digest `docker manifest inspect` reports for the tag. That
          # one (d66f9448…) is the multi-arch OCI *index*; Envoy checksums the
          # resolved *platform manifest* instead and rejects the policy with
          #   "module downloaded from … has checksum 65d6009b…,
          #    which does not match: d66f9448…"  → reason: Invalid
          # so this is the linux/amd64 manifest digest.
          sha256: 65d6009b9da2e8965e592a08b74a86725435fc01aa39c756dce0bd5ea64b3f4e
      config:
        # ORDER MATTERS. @recommended-conf itself sets `SecRuleEngine
        # DetectionOnly`, so every engine-level override has to come AFTER the
        # include or it is silently reset. This is the trap when switching to
        # enforcement later: `SecRuleEngine On` placed above the include would
        # be reverted to DetectionOnly and the WAF would never block anything.
        directives_map:
          default:
            - "Include @recommended-conf"
            # ENFORCING. Must stay AFTER the include, which itself sets
            # DetectionOnly — placed above it this line would be silently
            # reverted and the WAF would never block anything. Rollback to
            # observation mode is this one word.
            - "SecRuleEngine On"
            - "SecAuditEngine RelevantOnly"
            - "SecResponseBodyMimeType text/plain text/html text/xml application/json"
            - "Include @crs-setup-conf"
            - "Include @owasp_crs/*.conf"
            # Must come AFTER the includes — it references a loaded rule by id.
            #
            # 932160 ("Remote Command Execution: Unix Shell Code Found") looks
            # for shell tokens, and its list contains "$path". It therefore
            # matches the *name* of a legacy RFC 2109 cookie ($Path), which some
            # HTTP client libraries still send:
            #   Matched Data: $path found within REQUEST_COOKIES_NAMES:$Path
            # That was 93 of 93 detections in the first day of detect-only mode
            # — every single one a false positive on the cookie name, none an
            # actual payload. Left in place it scores 15 per request, exceeds
            # the inbound anomaly threshold, and would block those requests once
            # SecRuleEngine flips to On.
            #
            # Drop only the cookie-name target. The rule stays fully active for
            # ARGS, request body and URI, which is where real shell injection
            # would appear.
            - 'SecRuleUpdateTargetById 932160 "!REQUEST_COOKIES_NAMES"'
            # @recommended-conf enables SecRequestBodyAccess, so the login POST
            # body is inspected — password field included. Passwords legally
            # contain what CRS hunts for: an apostrophe reads as SQLi, an angle
            # bracket as XSS. Left in place, a user whose password contains one
            # is blocked from logging in, and it presents as "wrong password"
            # rather than as a WAF block — near-impossible to diagnose.
            #
            # Drop ARGS:password as a target from every CRS-tagged rule. That
            # field is only ever a credential; it never reaches an interpreter
            # where an injection could fire. username and credentialId stay
            # inspected. Verified: Coraza implements SecRuleUpdateTargetByTag,
            # and CRS rules carry the tag OWASP_CRS.
            - 'SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:password"'

            # ---- Positive model: Keycloak path allowlist -------------------
            # CRS above is a blocklist — it only reacts to patterns it already
            # knows. This rule is the inverse: anything outside Keycloak's
            # actually published surface is flagged. Derived from this realm's
            # own discovery document plus an observed interactive login, not
            # from guesswork:
            #   /realms/mog                       issuer
            #   /realms/mog/.well-known/...       discovery
            #   /realms/mog/protocol/openid-connect/...
            #                                     auth, token, certs, userinfo,
            #                                     logout, revoke, introspect,
            #                                     auth/device, ext/ciba, ext/par,
            #                                     login-status-iframe.html
            #   /realms/mog/login-actions/...     interactive login flow
            #   /realms/mog/clients-registrations/...
            #   /resources/...                    login theme assets
            #   /robots.txt
            #
            # The realm is pinned to `mog` on purpose. /realms/master is the
            # Keycloak admin realm and was found reachable from the internet
            # (openid-configuration 200, auth 302) even though only `mog` is
            # used publicly — so master lands outside the allowlist too. Add
            # further realms here explicitly if that ever changes.
            #
            # The `(/|/(...))?` shape allows the bare issuer both with and
            # without a trailing slash. The first live test flagged
            # /realms/mog/ as outside the surface — a bug in this rule, not an
            # attack; keep that alternation when editing.
            # Still `pass,log` — it reports, it does not block, matching the
            # engine-wide DetectionOnly stance. Verify with:
            #   kubectl logs -n envoy-gateway-system <envoy-pod> -c envoy \
            #     | grep keycloak-allowlist
            # Once a few days show only scanner noise, swap `pass,log` for
            # `deny,status:404,log` — 404 rather than 403 so the surface is not
            # enumerable.
            - 'SecRule REQUEST_URI "!@rx ^/(robots\.txt|resources/.*|realms/mog(/|/(\.well-known/.*|protocol/openid-connect(/.*)?|login-actions/.*|clients-registrations/.*))?)$" "id:2000,phase:1,pass,log,msg:''keycloak-allowlist: path outside published surface'',tag:''keycloak-allowlist''"'
        default_directives: default
